<title>Bonus &amp; Đền bù Tân Tạo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --line:#d8dee7; --ink:#14213d; --muted:#5b6678;
  --accent:#1e3a8a; --accent-ink:#ffffff; --err:#b42318; --err-bg:#fdecea;
  --font-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#111a2c; --line:#24314a; --ink:#e6ebf4; --muted:#93a0b6;
    --accent:#93b4ff; --accent-ink:#0b1220; --err:#ff8a80; --err-bg:#3a1414; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2c; --line:#24314a; --ink:#e6ebf4; --muted:#93a0b6;
  --accent:#93b4ff; --accent-ink:#0b1220; --err:#ff8a80; --err-bg:#3a1414; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.kicker{font-size:12px;color:var(--muted);margin:0 0 4px;letter-spacing:.02em}
h1{font-size:19px;font-weight:700;margin:0 0 20px;line-height:1.35}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:500 15px/1.2 var(--font-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;outline:none}
input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[aria-invalid="true"]{border-color:var(--err)}
button{margin-top:14px;width:100%;appearance:none;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;
  font:600 14px/1 var(--font-ui);background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:20px;margin:12px 0 0;font-size:13px}
.msg.err{color:var(--err);background:var(--err-bg);border-radius:8px;padding:8px 10px}
.msg.info{color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <p class="kicker">Kho Tân Tạo · Bonus BQL &amp; Đền bù</p>
  <h1>Nhập mật khẩu để xem báo cáo</h1>
  <form id="f" autocomplete="off">
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus aria-describedby="msg">
    <button id="btn" type="submit">Mở báo cáo</button>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
  var f = document.getElementById("f"), pw = document.getElementById("pw"),
      btn = document.getElementById("btn"), msg = document.getElementById("msg");
  function bao(text, loai){ msg.textContent = text; msg.className = "msg" + (loai ? " " + loai : ""); }

  function moKhoa(matKhau){
    var C = window.CryptoJS;
    var g = JSON.parse(document.getElementById("du-lieu-ma-hoa").textContent);
    var k = C.PBKDF2(matKhau, C.enc.Hex.parse(g.salt), { keySize: 8, iterations: g.vong, hasher: C.algo.SHA256 });
    var kEnc = C.HmacSHA256("ma-hoa", k), kMac = C.HmacSHA256("xac-thuc", k);
    var iv = C.enc.Hex.parse(g.iv), ct = C.enc.Base64.parse(g.ct);
    var mac = C.HmacSHA256(iv.clone().concat(ct), kMac).toString(C.enc.Hex);
    if (mac !== g.mac) return null;                       // sai mật khẩu: không giải mã gì cả
    var out = C.AES.decrypt({ ciphertext: ct }, kEnc, { iv: iv, mode: C.mode.CBC, padding: C.pad.Pkcs7 });
    return out.toString(C.enc.Utf8);
  }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var matKhau = pw.value;
    if (!matKhau) return;
    if (!window.CryptoJS){ bao("Không tải được thư viện giải mã. Kiểm tra kết nối mạng rồi tải lại trang.", "err"); return; }
    btn.disabled = true; pw.removeAttribute("aria-invalid"); bao("Đang mở…", "info");
    setTimeout(function(){
      var html = null;
      try { html = moKhoa(matKhau); } catch(err) { html = null; }
      if (!html){
        btn.disabled = false; pw.setAttribute("aria-invalid", "true"); pw.select();
        bao("Sai mật khẩu. Vui lòng thử lại.", "err");
        return;
      }
      document.open(); document.write(html); document.close();
    }, 30);
  });
})();
</script>
